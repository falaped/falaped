<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo 2.0</title>
<!-- Etapa 3 · rodadas 1 e 2. Tokens copiados de ficha-design.html (fonte da verdade): ao mudar a ficha, recopiar o bloco de estilo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/lucide@0.511.0/dist/umd/lucide.min.js"></script>
<style type="text/tailwindcss">
/*
  Falaped 2.0 · ficha de design (Etapa 2) · 06/10/2026
  Fonte da verdade dos tokens: este bloco, com os nomes do shadcn (marcados NOVO os que não existem hoje). A implementação copia :root/.dark/@theme para app/globals.css.
  Rampas em oklch, matiz da marca 255.41. Contraste medido (WCAG) para todos os pares listados na seção Cores.
*/
@custom-variant dark (&:is(.dark *));
:root {
  /* primitivos: neutros frios (matiz da marca, croma baixo) */
  --n-0: oklch(1 0 0); --n-25: oklch(0.985 0.003 255.41); --n-50: oklch(0.97 0.004 255.41);
  --n-100: oklch(0.945 0.006 255.41); --n-200: oklch(0.915 0.007 255.41); --n-300: oklch(0.87 0.009 255.41);
  --n-400: oklch(0.66 0.013 255.41); --n-500: oklch(0.54 0.014 255.41); --n-600: oklch(0.46 0.015 255.41);
  --n-700: oklch(0.37 0.015 255.41); --n-900: oklch(0.21 0.012 255.41);
  /* primitivos: marca */
  --b-50: oklch(0.975 0.012 255.41); --b-100: oklch(0.95 0.021 255.41); --b-200: oklch(0.91 0.04 255.41);
  --b-300: oklch(0.85 0.068 255.41); --b-400: oklch(0.7603 0.0916 255.41); --b-450: oklch(0.72 0.1 255.41);
  --b-500: oklch(0.66 0.11 255.41); --b-600: oklch(0.58 0.12 255.41); --b-700: oklch(0.52 0.11 255.41);
  --b-800: oklch(0.42 0.09 255.41); --b-ink-on: oklch(0.22 0.04 255.41);
  /* primitivos: status */
  --ok-50: oklch(0.97 0.02 155); --ok-200: oklch(0.89 0.06 155); --ok-600: oklch(0.6 0.13 155); --ok-700: oklch(0.48 0.11 155);
  --wa-50: oklch(0.975 0.02 80); --wa-200: oklch(0.9 0.08 80); --wa-500: oklch(0.78 0.15 75); --wa-700: oklch(0.5 0.1 60);
  --da-50: oklch(0.97 0.012 27); --da-200: oklch(0.89 0.05 27); --da-600: oklch(0.55 0.2 27); --da-700: oklch(0.5 0.18 27);

  /* semânticos com os nomes do shadcn (os únicos usados em componentes) */
  --background: var(--n-25);              /* fundo da página */
  --foreground: var(--n-900);             /* texto principal 17,7:1 */
  --card: var(--n-0); --card-foreground: var(--n-900);
  --popover: var(--n-0); --popover-foreground: var(--n-900);
  --muted: var(--n-50);                   /* superfície de apoio */
  --muted-foreground: var(--n-600);       /* texto secundário 7,1:1 */
  --subtle-foreground: var(--n-500);      /* NOVO · legenda e placeholder 5,1:1 (4,6 sobre muted) */
  --secondary: var(--n-100); --secondary-foreground: var(--n-900);  /* botão cinza */
  --accent: var(--n-100); --accent-foreground: var(--n-900);        /* hover de item, como no shadcn */
  --border: var(--n-200);                 /* contorno de card */
  --border-strong: var(--n-300);          /* NOVO · botão outline */
  --input: var(--n-400);                  /* contorno de campo 3,1:1 */
  --ring: var(--b-600);                   /* foco 4,3:1 */
  --primary: var(--b-400);                /* #8AB4EB, ação principal */
  --primary-foreground: var(--b-ink-on);  /* texto sobre a marca 8,1:1 */
  --primary-hover: var(--b-450);          /* NOVO */
  --primary-active: var(--b-500);         /* NOVO */
  --primary-soft: var(--b-100);           /* NOVO · chip, item ativo do menu */
  --primary-soft-border: var(--b-200);    /* NOVO */
  --primary-ink: var(--b-700);            /* já existe · link e texto azul 5,5:1 */
  --primary-ink-strong: var(--b-800);     /* NOVO · texto sobre primary-soft 7,3:1 */
  --destructive: var(--da-600);           /* alergia (sólido) */
  --destructive-foreground: var(--n-0);   /* branco no vermelho 5,4:1 */
  --danger-soft: var(--da-50); --danger-border: var(--da-200); --danger-text: var(--da-700);
  --success: var(--ok-600); --success-soft: var(--ok-50); --success-border: var(--ok-200); --success-text: var(--ok-700);
  --warning: var(--wa-500); --warning-soft: var(--wa-50); --warning-border: var(--wa-200); --warning-text: var(--wa-700);
  --sidebar: var(--n-50); --sidebar-foreground: var(--n-600); --sidebar-border: var(--n-200); --sidebar-ring: var(--b-600);
  --sidebar-primary: var(--b-400); --sidebar-primary-foreground: var(--b-ink-on);
  --sidebar-accent: var(--b-100); --sidebar-accent-foreground: var(--b-800);
  --gradient-highlight: radial-gradient(120% 140% at 0% 0%, var(--b-100) 0%, var(--n-0) 55%);
  --shadow-color: 0.25 0.03 255.41;
  --radius: 8px;
}
.dark {
  --background: oklch(0.17 0.008 255.41);
  --foreground: oklch(0.96 0.004 255.41);
  --card: oklch(0.21 0.009 255.41); --card-foreground: oklch(0.96 0.004 255.41);
  --popover: oklch(0.21 0.009 255.41); --popover-foreground: oklch(0.96 0.004 255.41);
  --muted: oklch(0.19 0.009 255.41);
  --muted-foreground: oklch(0.74 0.012 255.41);
  --subtle-foreground: oklch(0.62 0.012 255.41);
  --secondary: oklch(0.25 0.01 255.41); --secondary-foreground: oklch(0.96 0.004 255.41);
  --accent: oklch(0.25 0.01 255.41); --accent-foreground: oklch(0.96 0.004 255.41);
  --border: oklch(0.29 0.011 255.41);
  --border-strong: oklch(0.34 0.012 255.41);
  --input: oklch(0.52 0.012 255.41);
  --ring: oklch(0.78 0.09 255.41);
  --primary: oklch(0.78 0.09 255.41);
  --primary-foreground: oklch(0.22 0.04 255.41);
  --primary-hover: oklch(0.74 0.095 255.41);
  --primary-active: oklch(0.7 0.1 255.41);
  --primary-soft: oklch(0.3 0.05 255.41);
  --primary-soft-border: oklch(0.38 0.07 255.41);
  --primary-ink: oklch(0.82 0.08 255.41);
  --primary-ink-strong: oklch(0.88 0.06 255.41);
  --destructive: oklch(0.62 0.19 27); --destructive-foreground: oklch(1 0 0);
  --danger-soft: oklch(0.29 0.06 27); --danger-border: oklch(0.4 0.1 27); --danger-text: oklch(0.78 0.12 27);
  --success: oklch(0.7 0.14 155); --success-soft: oklch(0.28 0.05 155); --success-border: oklch(0.38 0.08 155); --success-text: oklch(0.82 0.12 155);
  --warning: oklch(0.8 0.14 75); --warning-soft: oklch(0.3 0.05 75); --warning-border: oklch(0.42 0.08 75); --warning-text: oklch(0.85 0.12 80);
  --sidebar: oklch(0.19 0.009 255.41); --sidebar-foreground: oklch(0.74 0.012 255.41); --sidebar-border: oklch(0.29 0.011 255.41); --sidebar-ring: oklch(0.78 0.09 255.41);
  --sidebar-primary: oklch(0.78 0.09 255.41); --sidebar-primary-foreground: oklch(0.22 0.04 255.41);
  --sidebar-accent: oklch(0.3 0.05 255.41); --sidebar-accent-foreground: oklch(0.88 0.06 255.41);
  --gradient-highlight: radial-gradient(120% 140% at 0% 0%, oklch(0.3 0.05 255.41) 0%, oklch(0.21 0.009 255.41) 60%);
  --shadow-color: 0.05 0.02 255.41;
}
@theme inline {
  --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
  --font-display: "Lexend", "Inter", ui-sans-serif, sans-serif;
  --color-background: var(--background); --color-foreground: var(--foreground);
  --color-card: var(--card); --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover); --color-popover-foreground: var(--popover-foreground);
  --color-muted: var(--muted); --color-muted-foreground: var(--muted-foreground); --color-subtle-foreground: var(--subtle-foreground);
  --color-secondary: var(--secondary); --color-secondary-foreground: var(--secondary-foreground);
  --color-accent: var(--accent); --color-accent-foreground: var(--accent-foreground);
  --color-border: var(--border); --color-border-strong: var(--border-strong); --color-input: var(--input); --color-ring: var(--ring);
  --color-primary: var(--primary); --color-primary-foreground: var(--primary-foreground);
  --color-primary-hover: var(--primary-hover); --color-primary-active: var(--primary-active);
  --color-primary-soft: var(--primary-soft); --color-primary-soft-border: var(--primary-soft-border);
  --color-primary-ink: var(--primary-ink); --color-primary-ink-strong: var(--primary-ink-strong);
  --color-destructive: var(--destructive); --color-destructive-foreground: var(--destructive-foreground);
  --color-danger-soft: var(--danger-soft); --color-danger-border: var(--danger-border); --color-danger-text: var(--danger-text);
  --color-success: var(--success); --color-success-soft: var(--success-soft); --color-success-border: var(--success-border); --color-success-text: var(--success-text);
  --color-warning: var(--warning); --color-warning-soft: var(--warning-soft); --color-warning-border: var(--warning-border); --color-warning-text: var(--warning-text);
  --color-sidebar: var(--sidebar); --color-sidebar-foreground: var(--sidebar-foreground); --color-sidebar-border: var(--sidebar-border); --color-sidebar-ring: var(--sidebar-ring);
  --color-sidebar-primary: var(--sidebar-primary); --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent); --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  /* forma (escala do shadcn sobre --radius 8): md 6 selo · lg 8 controle · xl 12 card · 2xl 16 janela */
  --radius-sm: calc(var(--radius) - 4px); --radius-md: calc(var(--radius) - 2px); --radius-lg: var(--radius);
  --radius-xl: calc(var(--radius) + 4px); --radius-2xl: calc(var(--radius) + 8px);
  /* sombras com o matiz da marca (substituem as shadow-hard-*) */
  --shadow-xs: 0 1px 2px oklch(var(--shadow-color) / 0.06);
  --shadow-sm: 0 1px 2px oklch(var(--shadow-color) / 0.06), 0 2px 6px oklch(var(--shadow-color) / 0.06);
  --shadow-md: 0 1px 3px oklch(var(--shadow-color) / 0.08), 0 6px 16px oklch(var(--shadow-color) / 0.10);
  --shadow-lg: 0 2px 6px oklch(var(--shadow-color) / 0.08), 0 16px 40px oklch(var(--shadow-color) / 0.16);
  /* escala tipográfica nomeada */
  --text-display: 30px; --text-display--line-height: 36px; --text-display--letter-spacing: -0.02em;
  --text-page: 24px; --text-page--line-height: 32px; --text-page--letter-spacing: -0.015em;
  --text-section: 18px; --text-section--line-height: 26px; --text-section--letter-spacing: -0.01em;
  --text-title: 15px; --text-title--line-height: 22px;
  --text-body: 14px; --text-body--line-height: 22px;
  --text-read: 16px; --text-read--line-height: 26px;
  --text-label: 13px; --text-label--line-height: 18px;
  --text-caption: 12px; --text-caption--line-height: 16px;
  --ease-out-soft: cubic-bezier(0.16, 1, 0.3, 1);
}
@layer base {
  * { @apply border-border; }
  body { @apply bg-background text-foreground font-sans text-body antialiased; font-feature-settings: "cv11", "ss01"; }
  .num { font-variant-numeric: tabular-nums; }
}
@layer components {
  /* botões: alturas 28 / 32 / 36 / 40, hover + clique + foco */
  .btn { @apply inline-flex items-center justify-center gap-2 rounded-lg font-medium text-body whitespace-nowrap select-none transition-[background-color,box-shadow,transform] duration-150 ease-(--ease-out-soft) outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background active:translate-y-px disabled:opacity-50 disabled:pointer-events-none h-9 px-3.5; }
  .btn-lg { @apply h-10 px-4; } .btn-sm { @apply h-8 px-3 text-label; } .btn-xs { @apply h-7 px-2.5 text-caption; }
  .btn-primary { @apply bg-primary text-primary-foreground font-semibold shadow-xs hover:bg-primary-hover active:bg-primary-active; }
  .btn-secondary { @apply bg-card text-foreground border border-border-strong shadow-xs hover:bg-accent; }
  .btn-ghost { @apply text-foreground hover:bg-accent; }
  .btn-danger { @apply text-danger-text hover:bg-danger-soft; }
  .btn-link { @apply h-auto px-0 text-primary-ink underline-offset-4 hover:underline; }
  /* selos com papel fixo */
  .badge { @apply inline-flex items-center gap-1 h-6 px-2 rounded-md text-caption font-medium border whitespace-nowrap; }
  .badge-neutral { @apply bg-muted text-muted-foreground border-border; }
  .badge-accent { @apply bg-primary-soft text-primary-ink-strong border-primary-soft-border; }
  .badge-success { @apply bg-success-soft text-success-text border-success-border; }
  .badge-warning { @apply bg-warning-soft text-warning-text border-warning-border; }
  .badge-danger { @apply bg-danger-soft text-danger-text border-danger-border; }
  .badge-clinical { @apply bg-destructive text-destructive-foreground border-transparent font-semibold; }
  /* campos */
  .field-label { @apply text-label font-medium text-foreground; }
  .field-help { @apply text-caption text-subtle-foreground; }
  .input { @apply h-9 w-full rounded-lg border border-input bg-card px-3 text-body text-foreground placeholder:text-subtle-foreground outline-none transition-shadow focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/25 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20; }
  /* superfícies: destaque / comum / apoio */
  .card { @apply rounded-xl border border-border bg-card; }
  .card-highlight { @apply rounded-xl border border-primary-soft-border shadow-sm; background: var(--gradient-highlight); }
  .card-sunken { @apply rounded-xl bg-muted; }
  /* títulos */
  .t-display { @apply font-display text-display font-semibold; }
  .t-page { @apply font-display text-page font-semibold; }
  .t-section { @apply font-display text-section font-semibold; }
  .t-card { @apply text-title font-semibold; }
  /* só desta página */
  .doc-sec { @apply border-t border-border pt-10 mt-12; }
  .doc-lead { @apply text-body text-muted-foreground mb-6 max-w-[68ch]; }
  .doc-k { @apply font-mono text-[11px] text-subtle-foreground; }
}
</style>
<style>
  .ic { width: 16px; height: 16px; stroke-width: 1.75; flex-shrink: 0; }
  .ic-sm { width: 14px; height: 14px; }
  .kbd { font: 500 11px/1 Inter, sans-serif; padding: 3px 5px; border-radius: 4px; border: 1px solid var(--border); color: var(--subtle-foreground); background: var(--card); }
</style>
</head>
<body class="overflow-hidden">
<div class="flex h-14 items-center gap-3 border-b border-border bg-card px-4">
  <span class="t-card shrink-0">Protótipo 2.0</span><span class="badge badge-neutral shrink-0">Rodadas 1 e 2</span>
  <div id="nav" class="ml-3 flex min-w-0 flex-1 gap-1 overflow-x-auto whitespace-nowrap"></div>
  <div class="flex shrink-0 items-center gap-2">
    <button class="btn btn-ghost btn-sm" onclick="step(-1)" aria-label="Tela anterior"><i data-lucide="chevron-left" class="ic"></i></button>
    <button class="btn btn-ghost btn-sm" onclick="step(1)" aria-label="Próxima tela"><i data-lucide="chevron-right" class="ic"></i></button>
    <button id="themeBtn" class="btn btn-secondary btn-sm">Ver escuro</button>
  </div>
</div>
<div id="screen" class="h-[calc(100vh-56px)] overflow-hidden"></div>

<script>
const I = (n, c = "") => `<i data-lucide="${n}" class="ic ${c}"></i>`;
const AV = (t, o = {}) => `<span class="grid ${o.s || "size-9"} shrink-0 place-items-center rounded-full ${o.on ? "bg-primary-soft text-primary-ink-strong" : "bg-muted text-muted-foreground"} ${o.t || "text-label"} font-semibold">${t}</span>`;
/* símbolos de atenção: o ícone diz o tipo; passar o mouse, focar ou clicar mostra o detalhe */
const SIG_KIND = {
  danger: "border-transparent bg-destructive text-destructive-foreground",
  warning: "border-warning-border bg-warning-soft text-warning-text",
  neutral: "border-border bg-muted text-muted-foreground",
};
const SIG = (ic, kind, title, detail, o = {}) => `<span class="group/sig relative inline-flex" tabindex="0" aria-label="${title}">
  <span class="grid ${o.lg ? "size-8" : "size-7"} place-items-center rounded-full border ${SIG_KIND[kind]} ${kind === "danger" ? "shadow-xs" : ""}">${I(ic, o.lg ? "" : "ic-sm")}</span>
  <span role="tooltip" class="pointer-events-none absolute ${o.right ? "right-0" : "left-0"} top-full z-30 mt-2 ${o.open ? "block" : "hidden"} w-64 rounded-xl border border-border bg-popover p-3 text-left font-normal shadow-md group-hover/sig:block group-focus/sig:block">
    <span class="flex items-center gap-1.5 font-semibold ${kind === "danger" ? "text-danger-text" : kind === "warning" ? "text-warning-text" : "text-foreground"}">${I(ic, "ic-sm")}${title}</span>
    <span class="mt-0.5 block text-caption text-muted-foreground">${detail}</span></span></span>`;
const S_ALLERGY = (o) => SIG("triangle-alert", "danger", "Alergia: amoxicilina", "Exantema em 06/2025. Checada em toda receita.", o);
const S_VACCINE = (o) => SIG("syringe", "warning", "Vacina atrasada", "Tríplice viral, 2ª dose, desde 10/09.", o);
const S_INCOMPLETE = (o) => SIG("file-warning", "warning", "Ficha incompleta", "Falta o sexo e o responsável. A curva de crescimento depende do sexo.", o);
const S_MEASURE = (o) => SIG("ruler", "warning", "Sem medida recente", "Última medida de peso e altura há 4 meses.", o);

/* ---------- menu lateral ---------- */
const NAV = [["inicio", "Início", "house", "a12"], ["consultas", "Consultas", "stethoscope", "b1"], ["pacientes", "Pacientes", "users", "b4"], ["documentos", "Documentos", "file-text", null], ["assistente", "Pergunte ao assistente", "message-circle-question", null], ["financeiro", "Financeiro", "wallet", null]];
function sidebar(o = {}) {
  const foot = (mini) => [["layout-template", "Modelos", null, ""], ["megaphone", "Novidades", null, `<span class="${mini ? "absolute right-2 top-2" : "ml-auto"} size-2 rounded-full bg-primary"></span>`]].map(([ic, l, go, extra]) => mini
    ? `<a title="${l}" class="relative grid size-10 place-items-center rounded-lg text-sidebar-foreground hover:bg-accent hover:text-foreground">${I(ic)}${extra}</a>`
    : `<a class="flex h-9 items-center gap-2.5 rounded-lg px-2.5 text-sidebar-foreground hover:bg-accent hover:text-foreground">${I(ic)}${l}${extra}</a>`).join("");
  if (o.mini) return `<aside class="flex w-[64px] shrink-0 flex-col items-center gap-1 border-r border-sidebar-border bg-sidebar py-4">
    <img src="../../public/falaped-icon.svg" alt="Falaped" class="mb-4 h-10 dark:hidden"><img src="../../public/falaped-icon-dark.svg" alt="Falaped" class="mb-4 hidden h-10 dark:block">
    <a data-go="a5" class="mb-2 grid size-10 place-items-center rounded-lg border border-primary-soft-border bg-primary-soft text-primary-ink-strong" title="Voltar à consulta · Helena D."><span class="relative text-label font-semibold">HD<span class="absolute -right-2 -top-1.5 size-2 rounded-full bg-success ring-2 ring-primary-soft"></span></span></a>
    <a data-go="a3" title="Buscar paciente (⌘K)" class="grid size-10 place-items-center rounded-lg text-sidebar-foreground hover:bg-accent hover:text-foreground">${I("search")}</a>
    ${NAV.map(([k, l, ic, go]) => `<a ${go ? `data-go="${go}"` : ""} title="${l}" class="grid size-10 place-items-center rounded-lg ${o.on === k ? "bg-sidebar-accent text-sidebar-accent-foreground" : "text-sidebar-foreground hover:bg-accent hover:text-foreground"}">${I(ic)}</a>`).join("")}
    <div class="flex-1"></div>
    <div class="flex flex-col items-center gap-1 border-t border-sidebar-border pt-2">${foot(1)}
      <a data-go="d4" title="Dra. Ana Souza · Seu perfil" class="mt-1 grid size-10 place-items-center rounded-lg hover:bg-accent">${AV("AS", { s: "size-8", t: "text-caption", on: 1 })}</a></div>
  </aside>`;
  const act = o.active === 1 ? { i: "HD", n: "Helena D.", t: "12:47" } : o.active;
  const top = act
    ? `<a data-go="a5" class="card-highlight mb-3 flex items-center gap-2.5 p-3 hover:shadow-md">
        <span class="relative grid size-8 place-items-center rounded-full bg-card text-label font-semibold text-primary-ink-strong">${act.i}<span class="absolute -right-0.5 -top-0.5 size-2.5 rounded-full bg-success ring-2 ring-card"></span></span>
        <div class="min-w-0 flex-1"><div class="text-label font-semibold">${act.n}</div><div class="text-caption text-muted-foreground">Voltar à consulta</div></div>
        <span class="text-caption num text-muted-foreground">${act.t}</span></a>`
    : `<button data-go="a3" class="btn btn-primary btn-lg mb-3 w-full">${I("plus")}Iniciar consulta</button>`;
  return `<aside class="flex w-[248px] shrink-0 flex-col border-r border-sidebar-border bg-sidebar px-3 pb-3 pt-6">

/* ---------- navegação ---------- */
let cur = 0;
const nav = document.getElementById("nav"), screen = document.getElementById("screen");
nav.innerHTML = S.map((s, i) => `<button data-i="${i}" class="h-8 rounded-lg px-2.5 text-label hover:bg-accent">${i + 1}. ${s.t}</button>`).join("");
nav.onclick = e => { const b = e.target.closest("[data-i]"); if (b) go(S[+b.dataset.i].id); };
function go(id) {
  const i = S.findIndex(s => s.id === id); if (i < 0) return; cur = i;
  screen.innerHTML = S[i].html();
  nav.querySelectorAll("button").forEach((b, j) => b.className = `h-8 rounded-lg px-2.5 text-label ${j === i ? "bg-primary-soft font-semibold text-primary-ink-strong" : "text-muted-foreground hover:bg-accent hover:text-foreground"}`);
  history.replaceState(null, "", "#" + id + (document.documentElement.classList.contains("dark") ? "-escuro" : ""));
  window.lucide && lucide.createIcons();
}
const step = d => go(S[(cur + d + S.length) % S.length].id);
screen.onclick = e => { const a = e.target.closest("[data-go]"); if (a) { e.preventDefault(); go(a.dataset.go); } };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight" && e.altKey) step(1); if (e.key === "ArrowLeft" && e.altKey) step(-1); });
const btn = document.getElementById("themeBtn");
function setDark(on) { document.documentElement.classList.toggle("dark", on); btn.textContent = on ? "Ver claro" : "Ver escuro"; history.replaceState(null, "", "#" + S[cur].id + (on ? "-escuro" : "")); }
btn.onclick = () => setDark(!document.documentElement.classList.contains("dark"));
const h = location.hash.slice(1);
go(h.replace("-escuro", "") || "a12");
if (h.endsWith("-escuro")) setDark(true);
</script>
